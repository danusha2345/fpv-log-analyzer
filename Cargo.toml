[package]
name = "fpv-log-analyzer"
version = "0.1.0"
edition = "2024"
description = "Blackbox log analyzer for FPV drones: noise, filters, step response, motors"
license = "GPL-3.0-or-later"
repository = "https://github.com/danusha2345/fpv-log-analyzer"

[dependencies]
eframe = { version = "0.36.2", features = ["glow", "persistence"] }
egui_plot = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
realfft = "3.5.0"
rfd = "0.17.2"
sys-locale = "0.3.2"

[profile.release]
strip = true

[dev-dependencies]
egui_kittest = "0.36.2"
